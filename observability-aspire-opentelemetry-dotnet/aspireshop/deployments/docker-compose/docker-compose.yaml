name: aspire-shop-infrastructure
services:
  #######################################################
  #  Observability: OpenTelemetry Collector
  #######################################################
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - "ASPIRE_OTLP_ENDPOINT=${ASPIRE_OTLP_ENDPOINT:-http://host.docker.internal:16223}"
      - ASPIRE_API_KEY=${ASPIRE_API_KEY:-}
      - ASPIRE_INSECURE=true
      - PROMETHEUS_ENDPOINT=http://prometheus:9090/api/v1/otlp
      - LOKI_ENDPOINT=http://loki:3100/otlp
      - TEMPO_URL=tempo:4317
      - ELASTICSEARCH_ENDPOINT=http://elasticsearch:9200
    volumes:
      - ./../configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC ingest from apps and services
      - "4318:4318" # OTLP HTTP ingest from apps and services
      - "8888:8888" # Collector self-telemetry metrics endpoint
      - "8889:8889" # Reserved observability endpoint for additional collector exporters
      - "13133:13133" # Collector health check endpoint
    networks:
      - infrastructure

  #######################################################
  #  Observability: Metrics (Prometheus)
  #######################################################
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    ports:
      - "9090:9090" # Prometheus UI and query API
    volumes:
      - ./../configs/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=native-histograms"
      - "--log.level=info"
    networks:
      - infrastructure

  node-exporter:
    image: prom/node-exporter:v1.12.1
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
    ports:
      - "9100:9100" # Node exporter metrics endpoint
    networks:
      - infrastructure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    platform: linux/amd64
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080" # cAdvisor metrics and UI endpoint
    networks:
      - infrastructure

  #######################################################
  #  Observability: S3-Compatible Storage (MinIO)
  #######################################################
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # MinIO Console UI
    volumes:
      - minio_data:/data
    networks:
      - infrastructure

  minio-bucket-creator:
    image: amazon/aws-cli:2.27.45
    restart: on-failure
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket loki >/dev/null 2>&1 || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket loki
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket tempo >/dev/null 2>&1 || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket tempo
        exit 0
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio:
        condition: service_started
    networks:
      - infrastructure

  #######################################################
  #  Observability: Traces & Logs (Grafana Stack)
  #######################################################
  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      - MINIO_USER=${MINIO_USER:-minioadmin}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - ./../configs/tempo.yaml:/etc/tempo.yaml
    expose:
      - "3200" # Tempo query API for Grafana
      - "4317" # Tempo OTLP gRPC ingest from collector
    depends_on:
      minio-bucket-creator:
        condition: service_completed_successfully
    networks:
      - infrastructure

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - MINIO_USER=${MINIO_USER:-minioadmin}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - ./../configs/loki-config.yaml:/etc/loki/local-config.yaml
    expose:
      - "3100" # Loki HTTP API for Grafana and OTLP log ingestion
    depends_on:
      minio-bucket-creator:
        condition: service_completed_successfully
    networks:
      - infrastructure

  grafana:
    image: grafana/grafana:13.2.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    depends_on:
      - prometheus
      - tempo
      - loki
      - elasticsearch
    ports:
      - "3000:3000" # Grafana UI
    volumes:
      - ./../configs/grafana/provisioning:/etc/grafana/provisioning
      - ./../configs/grafana/dashboards:/var/lib/grafana/dashboards-imported
    networks:
      - infrastructure

  grafana-dashboard-importer:
    image: python:3.13-alpine
    restart: on-failure
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GRAFANA_URL: http://grafana:3000
    volumes:
      - ./import-dashboards.py:/import-dashboards.py:ro
      - ./../configs/grafana/dashboards-source:/dashboards:ro
    command: ["python", "/import-dashboards.py"]
    depends_on:
      grafana:
        condition: service_started
    networks:
      - infrastructure

  #######################################################
  #  Observability: ELK Stack (Elasticsearch & Kibana)
  #######################################################
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - node.name=docker-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - network.host=0.0.0.0
      - http.port=9200
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200" # Elasticsearch REST API
      - "9300:9300" # Elasticsearch transport port
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - infrastructure

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.2
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601" # Kibana UI
    depends_on:
      - elasticsearch
    networks:
      - infrastructure

networks:
  infrastructure:
    name: infrastructure
    driver: bridge

volumes:
  minio_data:
  elasticsearch_data:
