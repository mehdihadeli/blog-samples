global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    collector: otel-collector

# App metrics are pushed from the OpenTelemetry Collector to Prometheus through otlp
otlp:
  promote_resource_attributes:
  - service.instance.id
  - service.name
  - service.namespace
  - service.version

scrape_configs:
- job_name: 'otel-collector'
  scrape_interval: 10s
  static_configs:
  - targets: [ 'otel-collector:8888' ]
  metric_relabel_configs:
  - target_label: integration
    replacement: collector-self-metrics

- job_name: 'prometheus'
  static_configs:
  - targets: [ 'prometheus:9090' ]
  metric_relabel_configs:
  - target_label: integration
    replacement: prometheus-self-metrics

- job_name: 'node-exporter'
  static_configs:
  - targets: [ 'node-exporter:9100' ]
  metric_relabel_configs:
  - target_label: integration
    replacement: node-host-metrics

- job_name: 'tempo'
  static_configs:
  - targets: [ 'tempo:3200' ]
  metric_relabel_configs:
  - target_label: integration
    replacement: tempo-self-metrics
