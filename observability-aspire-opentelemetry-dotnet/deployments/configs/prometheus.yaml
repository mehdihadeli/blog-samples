# Defaults applied to every scrape job unless a job overrides them.
global:
  # Pull metrics every 15 seconds.
  scrape_interval: 15s
  # Evaluate recording and alerting rules every 15 seconds.
  evaluation_interval: 15s
  # Labels attached to every stored time series from this Prometheus server.
  external_labels:
    collector: otel-collector

# Alternative: push metrics through Prometheus's OTLP HTTP receiver. Uncomment
# this block, enable --web.enable-otlp-receiver in Docker Compose, and configure
# the Collector's otlphttp/prometheus exporter to target /api/v1/otlp.
# otlp:
#   promote_resource_attributes:
#   - service.instance.id
#   - service.name
#   - service.namespace
#   - service.version

# Prometheus scrape jobs define where metrics are collected from.
scrape_configs:
  # Default: Prometheus pulls application metrics from the Collector's
  # Prometheus exporter at http://otel-collector:8889/metrics.
  # This preserves Prometheus's native pull and scrape behavior.
  # Application metrics exposed by the Collector's Prometheus exporter.
  - job_name: "otel-collector-app"
    # Scrape application metrics more frequently than the global default.
    scrape_interval: 10s
    # Resolve the Collector by its Docker Compose service name.
    static_configs:
      - targets: ["otel-collector:8889"]
    # Add a stable label identifying this integration in Grafana queries.
    metric_relabel_configs:
      - target_label: integration
        replacement: application-metrics

  # Collector self-observability metrics.
  - job_name: "otel-collector"
    # Scrape Collector runtime and pipeline health metrics.
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8888"]
    # Distinguish Collector metrics from application metrics.
    metric_relabel_configs:
      - target_label: integration
        replacement: collector-self-metrics

  # Prometheus runtime and storage health metrics.
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
    # Identify metrics generated by Prometheus itself.
    metric_relabel_configs:
      - target_label: integration
        replacement: prometheus-self-metrics

  # Host CPU, memory, disk, network, and kernel metrics from Node Exporter.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    # Mark these series as Prometheus-scraped host metrics.
    metric_relabel_configs:
      - target_label: origin_prometheus
        replacement: prometheus
      # Provide a stable dashboard selector for host metrics.
      - target_label: integration
        replacement: node-host-metrics

  # Per-container CPU, memory, filesystem, network, and lifecycle metrics.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    # Provide a stable dashboard selector for container metrics.
    metric_relabel_configs:
      - target_label: integration
        replacement: container-metrics

  # Tempo runtime and service health metrics.
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
    # Identify metrics generated by Tempo itself.
    metric_relabel_configs:
      - target_label: integration
        replacement: tempo-self-metrics
