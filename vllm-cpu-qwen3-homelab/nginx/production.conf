limit_req_zone $binary_remote_addr zone=vllm_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vllm_conn_per_ip:10m;

upstream token_gateway_upstream {
    server token-gateway:8081;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    location = /health {
        proxy_pass http://token_gateway_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/token-budget {
        proxy_pass http://token_gateway_upstream/admin/token-budget$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-Key $http_x_admin_key;
    }

    location /v1/ {
        limit_req zone=vllm_per_ip burst=20 nodelay;
        limit_conn vllm_conn_per_ip 10;

        proxy_pass http://token_gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
    }
}