services:
  vllm:
    image: vllm/vllm-openai:v0.10.0
    container_name: vllm-a100-production
    expose:
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      OTEL_SERVICE_NAME: vllm-a100-production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.name=vllm-a100-production,deployment.environment=production
    volumes:
      - ./data/huggingface:/root/.cache/huggingface
    gpus: all
    ipc: host
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=5)"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command:
      - --model
      - Qwen/Qwen3-0.6B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.90"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "128"
      - --max-num-batched-tokens
      - "8192"
      - --enable-prefix-caching
      - --api-key
      - ${VLLM_API_KEY:-changeme-production}
      - --disable-log-requests

  redis:
    image: redis:7.4-alpine
    container_name: vllm-production-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  token-gateway:
    build:
      context: ./token-gateway
    container_name: vllm-production-token-gateway
    depends_on:
      - redis
      - vllm
    expose:
      - "8081"
    environment:
      GATEWAY_PORT: "8081"
      REDIS_URL: redis://redis:6379/0
      TOKENIZER_MODEL: Qwen/Qwen3-0.6B
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-200000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-changeme-admin}
      UPSTREAM_URL: http://vllm:8000
      UPSTREAM_API_KEY: ${VLLM_API_KEY:-changeme-production}
    volumes:
      - ./data/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: vllm-production-edge
    depends_on:
      - token-gateway
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./configs/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: vllm-production-prometheus
    depends_on:
      - otel-collector
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.61.0
    container_name: vllm-production-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: vllm-production-otel-collector
    depends_on:
      - vllm
      - jaeger
    command:
      - --config=/conf/otel-collector-config.yaml
    volumes:
      - ./configs/otel/otel-collector-config.yaml:/conf/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"
    restart: unless-stopped
