APP_NAME = Forgejo Source Control
RUN_MODE = prod

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[server]
DOMAIN = localhost
ROOT_URL = http://localhost:3010/
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
SSH_DOMAIN = localhost
SSH_PORT = 2210
START_SSH_SERVER = false
APP_DATA_PATH = /data/gitea

[service]
DISABLE_REGISTRATION = true

[security]
INSTALL_LOCK = true
MIN_PASSWORD_LENGTH = 5
PASSWORD_COMPLEXITY = off

[webhook]
ALLOWED_HOST_LIST = private
DELIVER_TIMEOUT = 30

[actions]
ENABLED = false
