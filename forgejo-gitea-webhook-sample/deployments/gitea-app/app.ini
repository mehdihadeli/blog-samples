APP_NAME = Gitea Application CI
RUN_MODE = prod

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[server]
DOMAIN = localhost
ROOT_URL = http://localhost:3110/
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
SSH_DOMAIN = localhost
SSH_PORT = 2211
START_SSH_SERVER = false
APP_DATA_PATH = /data/gitea

[service]
DISABLE_REGISTRATION = true

[security]
INSTALL_LOCK = true
; Local lab only: allows the documented admin/admin default account.
MIN_PASSWORD_LENGTH = 5
; Local lab only: allow outbound webhooks to compose-network addresses.
ALLOWED_HOST_LIST = private

[migrations]
; Push mirrors (and migrations) are gated by their own egress list.
ALLOWED_HOST_LIST = private

[webhook]
DELIVER_TIMEOUT = 30

; Gitea Actions runs on this instance, executed by the attached runner.
[actions]
ENABLED = true
