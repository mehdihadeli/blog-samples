global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # agentgateway native Prometheus endpoint (gateway container, port 15020)
  - job_name: agentgateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:15020"]

  # OTel collector's own prometheus exporter (collector-generated metrics)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
