apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-image
spec:
  description: Generate a CycloneDX SBOM and scan the exact candidate image digest before signing.
  params:
    - name: image
      description: Immutable image reference, repository@sha256:digest
    - name: scanner-image
      default: aquasec/trivy:0.76.2
    - name: severity
      default: HIGH,CRITICAL
    - name: registry-insecure
      default: "false"
  workspaces:
    - name: registry-auth
      readOnly: true
    - name: reports
  steps:
    - name: scan-and-sbom
      image: $(params.scanner-image)
      env:
        - name: IMAGE
          value: $(params.image)
        - name: SEVERITY
          value: $(params.severity)
        - name: TRIVY_INSECURE
          value: $(params.registry-insecure)
        - name: DOCKER_CONFIG
          value: $(workspaces.registry-auth.path)
      script: |
        #!/bin/sh
        set -eu
        printf '%s' "$IMAGE" | grep -Eq '^.+@sha256:[a-f0-9]{64}$'
        mkdir -p "$(workspaces.reports.path)/security" "$(workspaces.reports.path)/sbom"
        trivy image --image-src remote --scanners vuln --format cyclonedx \
          --output "$(workspaces.reports.path)/sbom/image.cdx.json" "$IMAGE"
        trivy image --image-src remote --scanners vuln,secret,misconfig \
          --image-config-scanners misconfig,secret --ignorefile /dev/null \
          --severity "$SEVERITY" --exit-code 1 --format sarif \
          --output "$(workspaces.reports.path)/security/trivy-image.sarif" "$IMAGE"