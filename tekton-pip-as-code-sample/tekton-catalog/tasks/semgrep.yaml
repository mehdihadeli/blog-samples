apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: semgrep
spec:
  description: Fail on Semgrep security-audit findings and retain SARIF evidence.
  params:
    - name: scanner-image
      default: semgrep/semgrep:1.142.0
    - name: rules
      default: p/security-audit
  workspaces:
    - name: source
      readOnly: true
    - name: reports
  steps:
    - name: scan
      image: $(params.scanner-image)
      workingDir: $(workspaces.source.path)
      env:
        - name: RULES
          value: $(params.rules)
      script: |
        #!/bin/sh
        set -eu
        mkdir -p "$(workspaces.reports.path)/security"
        semgrep scan --config "$RULES" --error --strict --metrics=off \
          --exclude .git --exclude '**/bin' --exclude '**/obj' \
          --sarif --output "$(workspaces.reports.path)/security/semgrep.sarif" .