apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-sign
spec:
  description: Sign an image digest and attest its CycloneDX SBOM with a local encrypted key. No keyless identity is claimed.
  params:
    - name: image
    - name: cosign-image
      default: gcr.io/projectsigstore/cosign:v3.0.6
    - name: password-secret
      default: cosign-signing-key
    - name: registry-insecure
      default: "false"
  workspaces:
    - name: registry-auth
      readOnly: true
    - name: signing-key
      readOnly: true
    - name: reports
      readOnly: true
  stepTemplate:
    env:
      - name: DOCKER_CONFIG
        value: $(workspaces.registry-auth.path)
      - name: COSIGN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: $(params.password-secret)
            key: password
  steps:
    - name: sign-image
      image: $(params.cosign-image)
      command: [/ko-app/cosign]
      args:
        - sign
        - --yes
        - --key=$(workspaces.signing-key.path)/cosign.key
        - --tlog-upload=false
        - --allow-http-registry=$(params.registry-insecure)
        - --allow-insecure-registry=$(params.registry-insecure)
        - $(params.image)
    - name: attest-sbom
      image: $(params.cosign-image)
      command: [/ko-app/cosign]
      args:
        - attest
        - --yes
        - --key=$(workspaces.signing-key.path)/cosign.key
        - --type=cyclonedx
        - --predicate=$(workspaces.reports.path)/sbom/image.cdx.json
        - --tlog-upload=false
        - --allow-http-registry=$(params.registry-insecure)
        - --allow-insecure-registry=$(params.registry-insecure)
        - $(params.image)