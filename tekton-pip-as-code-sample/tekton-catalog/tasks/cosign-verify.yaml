apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-verify
spec:
  description: Independently verify image and SBOM signatures using only a trusted public key before GitOps promotion.
  params:
    - name: image
    - name: cosign-image
      default: gcr.io/projectsigstore/cosign:v3.0.6
    - name: registry-insecure
      default: "false"
  workspaces:
    - name: registry-auth
      readOnly: true
    - name: public-key
      readOnly: true
    - name: reports
  results:
    - name: verified-image
  stepTemplate:
    env:
      - name: DOCKER_CONFIG
        value: $(workspaces.registry-auth.path)
  steps:
    - name: verify-image
      image: $(params.cosign-image)
      command: [/ko-app/cosign]
      args:
        - verify
        - --key=$(workspaces.public-key.path)/cosign.pub
        - --insecure-ignore-tlog=true
        - --allow-http-registry=$(params.registry-insecure)
        - --allow-insecure-registry=$(params.registry-insecure)
        - $(params.image)
    - name: verify-sbom
      image: $(params.cosign-image)
      command: [/ko-app/cosign]
      args:
        - verify-attestation
        - --key=$(workspaces.public-key.path)/cosign.pub
        - --type=cyclonedx
        - --insecure-ignore-tlog=true
        - --allow-http-registry=$(params.registry-insecure)
        - --allow-insecure-registry=$(params.registry-insecure)
        - $(params.image)
    - name: record-verified-image
      image: alpine:3.22
      env:
        - name: IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        printf '%s' "$IMAGE" | grep -Eq '^.+@sha256:[a-f0-9]{64}$'
        printf '%s' "$IMAGE" > "$(results.verified-image.path)"
        printf '%s' "$IMAGE" > "$(workspaces.reports.path)/verified-image.txt"