apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: dotnet-ci
  annotations:
    pipelinesascode.tekton.dev/task: https://raw.githubusercontent.com/tektoncd/catalog/112374ce1262b133a77300bd8133445722605e04/task/git-clone/0.1/git-clone.yaml
    pipelinesascode.tekton.dev/task-1: ../tasks/dotnet-build.yaml
spec:
  description: Clone a repository and build its .NET project.
  params:
    - name: repo-url
    - name: revision
    - name: project-directory
      default: src
    - name: sdk-image
      default: mcr.microsoft.com/dotnet/sdk:10.0
  workspaces:
    - name: shared-workspace
  results:
    - name: source-commit
      value: $(tasks.fetch-repository.results.commit)
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace
          subPath: source
    - name: build-dotnet
      runAfter: [fetch-repository]
      taskRef:
        name: dotnet-build
      params:
        - name: sdk-image
          value: $(params.sdk-image)
        - name: project-directory
          value: $(params.project-directory)
      workspaces:
        - name: source
          workspace: shared-workspace
          subPath: source
