apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: dotnet-sample-pipeline-run
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/pipeline: "http://host.docker.internal:3000/admin/tekton-catalog/raw/branch/main/pipelines/dotnet-devsecops.yaml"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-release
  timeouts:
    pipeline: 1h0m0s
  pipelineRef:
    name: dotnet-devsecops
  params:
    - name: repo-url
      value: "http://host.docker.internal:3000/admin/dotnet-tekton-sample.git"
    - name: revision
      value: "{{ revision }}"
    - name: branch
      value: main
    - name: project-directory
      value: src
    - name: test-project
      value: tests/dotnet-tekton-sample.Tests.csproj
    - name: image-repository
      value: host.k3d.internal:3000/admin/dotnet-tekton-sample
    - name: registry-tls-verify
      value: "false"
    - name: registry-insecure
      value: "true"
    - name: gitops-url
      value: http://host.docker.internal:3000/admin/dotnet-gitops.git
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    - name: registry-auth
      secret:
        secretName: gitea-registry
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: signing-key
      secret:
        secretName: cosign-signing-key
        items:
          - key: cosign.key
            path: cosign.key
    - name: public-key
      secret:
        secretName: cosign-public-key
    - name: gitops-auth
      secret:
        secretName: gitops-auth