name: gitea

networks:
  gitea:
    external: false

services:
  configure:
    image: python:3.12-alpine
    network_mode: none
    command: ["python", "/setup/configure.py"]
    volumes:
      - gitea-data:/data
      - ./app.ini:/setup/app.ini:ro
      - ./configure.py:/setup/configure.py:ro

  server:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea
    command:
      - /bin/sh
      - -c
      - cp /setup/bootstrap-admin.sh /etc/s6/gitea/run && chmod +x /etc/s6/gitea/run && exec /usr/bin/s6-svscan /etc/s6
    depends_on:
      configure:
        condition: service_completed_successfully
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA_ADMIN_USERNAME=admin
      - GITEA_ADMIN_PASSWORD=admin
      - GITEA_ADMIN_EMAIL=admin@example.com
    restart: always
    networks:
      - gitea
    volumes:
      - gitea-data:/data
      - ./bootstrap-admin.sh:/setup/bootstrap-admin.sh:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:222:22"

volumes:
  gitea-data: