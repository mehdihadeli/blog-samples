apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnet-tekton-sample
  namespace: argocd
spec:
  project: dotnet-sample
  source:
    repoURL: http://host.docker.internal:3000/admin/dotnet-gitops.git
    targetRevision: main
    path: apps/dotnet-tekton-sample/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: dotnet-sample
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m