APP_NAME = Local GitLab CI Gitea
RUN_MODE = prod

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[server]
DOMAIN = localhost
ROOT_URL = http://localhost:3000/
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
SSH_DOMAIN = localhost
SSH_PORT = 22222
START_SSH_SERVER = false
APP_DATA_PATH = /data/gitea

[service]
DISABLE_REGISTRATION = true

[security]
INSTALL_LOCK = true
ALLOWED_HOST_LIST = gitlab:8929, private:8929

[webhook]
DELIVER_TIMEOUT = 30

[actions]
ENABLED = false