spec:
  inputs:
    stage:
      type: string
      default: test
      description: "The stage where the secret detection scanning job will run."
    image_prefix:
      type: string
      default: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
      description: "Override the name of the Docker registry providing the default images (proxy)."
    image_tag:
      type: string
      default: '7'
      description: "Override the default version of the `secrets` analyzer image."
    image_suffix:
      type: string
      default: ""
      description: "Suffix added to the image name. If set to -fips, [FIPS-enabled images](https://docs.gitlab.com/ee/user/application_security/secret_detection/#use-fips-enabled-images) are used for scan."
    enable_mr_pipelines:
      type: boolean
      default: false
      description: "If set to `true` secret-detection jobs run on MR Pipelines"
    historic_scan:
      type: boolean
      default: false
      description: "Flag indicating whether a historic scan to check for secrets from all commits and branches in the Git repository need to be performed"
    excluded_paths:
      type: string
      default: ""
      description: "A comma-separated list of paths (globs supported) to exclude from the scan."
---
variables:
    SECRET_DETECTION_HISTORIC_SCAN: "$[[ inputs.historic_scan ]]"
    SECRET_DETECTION_EXCLUDED_PATHS: "$[[ inputs.excluded_paths ]]"

.secret-detection-rules:true:
  rules:
    # If there is an open MR on this branch do not run the job on a "Branch" pipeline
    # https://docs.gitlab.com/ee/ci/pipelines/mr_pipeline_troubleshooting.html#two-pipelines-when-pushing-to-a-branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

.secret-detection-rules:false:
  rules:
    - if: $CI_COMMIT_BRANCH
      when: always
    - when: never

secret_detection:
  extends: '.secret-detection-rules:$[[ inputs.enable_mr_pipelines ]]'
  stage: $[[ inputs.stage ]]
  image: "$[[ inputs.image_prefix ]]/secrets:$[[ inputs.image_tag ]]$[[ inputs.image_suffix ]]"
  services: []
  allow_failure: true
  variables:
    GIT_DEPTH: "50"
  # `rules` must be overridden explicitly by each child job
  # see https://gitlab.com/gitlab-org/gitlab/-/issues/218444
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - "gl-secret-detection-report.json"
  script:
    - /analyzer run
