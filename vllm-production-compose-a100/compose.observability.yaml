services:
  engine:
    environment:
      OTEL_SERVICE_NAME: vllm-engine
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.name=vllm-engine,deployment.environment=compose

  router:
    environment:
      ROUTER_EXTRA_ARGS: ${ROUTER_EXTRA_ARGS:-} --otel-endpoint otel-collector:4317 --otel-service-name vllm-router

  jaeger:
    image: jaegertracing/all-in-one:1.61.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: otel-collector
    restart: unless-stopped
    depends_on:
      router:
        condition: service_started
      engine:
        condition: service_started
      jaeger:
        condition: service_started
    command:
      - --config=/conf/otel-collector-config.yaml
    volumes:
      - ./configs/otel/otel-collector-config.yaml:/conf/otel-collector-config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090

  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000
