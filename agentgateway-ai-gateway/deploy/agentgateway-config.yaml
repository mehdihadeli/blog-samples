# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  adminAddr: 0.0.0.0:15000
  modelCatalog:
    - file: /costs/catalog.json
  logging:
    format: json
    database:
      url: sqlite:///var/log/agentgateway/request-log.db
  metrics:
    fields:
      add:
        user_id: apiKey.user
  tracing:
    otlpEndpoint: http://otel-collector:4317
    randomSampling: true
llm:
  policies:
    apiKey:
      mode: strict
      keys:
        - key: sk-alice-abc123def456
          metadata:
            user: alice
        - key: sk-bob-xyz789uvw012
          metadata:
            user: bob
    guardrails:
      streaming: Enabled
      request:
        - regex:
            action: reject
            rules:
              - pattern: (?i)(ignore|disregard) (all )?(previous|prior|above) (instructions|prompts|rules|messages)
              - pattern: (?i)(reveal|show) (your|the) (system prompt|system instructions|prompt)
              - pattern: (?i)(you are now|act as if) .*(no restrictions|unfiltered|uncensored)
      response:
        - regex:
            action: reject
            rules:
              - builtin: email
              - builtin: ssn
              - builtin: creditCard
    localRateLimit:
      - maxTokens: 60
        tokensPerFill: 1
        fillInterval: 1s
        type: requests
      - maxTokens: 50000
        tokensPerFill: 50000
        fillInterval: 1h
        type: tokens
  models:
    - name: deepseek-chat
      visibility: public
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-chat
      transformation:
        max_tokens: "min(llmRequest.max_tokens, 1024)"
    - name: deepseek-reasoner
      visibility: public
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-reasoner
      transformation:
        max_tokens: "min(llmRequest.max_tokens, 1024)"
    - name: deepseek-chat-backup
      visibility: internal
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-chat
      health:
        eviction:
          consecutiveFailures: 1
          duration: 60s
  virtualModels:
    - name: deepseek-smart
      routing:
        weighted:
          targets:
            - model: deepseek-chat
              weight: 70
            - model: deepseek-reasoner
              weight: 30
    - name: deepseek-resilient
      routing:
        failover:
          targets:
            - model: deepseek-chat
              priority: 0
            - model: deepseek-chat-backup
              priority: 1
mcp:
  statefulMode: stateless
  policies:
    cors:
      allowOrigins:
        - http://localhost:15000
      allowMethods:
        - POST
        - OPTIONS
        - GET
      allowHeaders:
        - authorization
        - content-type
        - accept
        - cache-control
        - mcp-protocol-version
        - mcp-session-id
        - "*"
      exposeHeaders:
        - mcp-session-id
      allowCredentials: true
      maxAge: 10m
    mcpAuthentication:
      mode: strict
      issuer: http://host.docker.internal:8080/realms/agentgateway
      audiences:
        - agentgateway
      jwks:
        url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
      provider:
        keycloak: {}
      clientId: agentgateway-browser
      clientSecret: agentgateway-browser-secret
      resourceMetadata:
        resource: http://localhost:3000/mcp
        scopesSupported:
          - read:all
        bearerMethodsSupported:
          - header
    mcpAuthorization:
      rules:
        - mcp.tool.target == "tickets"
        - mcp.tool.target == "catalog"
        - mcp.tool.target == "time"
        - mcp.tool.target == "everything"
        - mcp.tool.target == "customers" && "support-admin" in jwt.realm_access.roles
        - mcp.tool.target == "openapi"
    localRateLimit:
      - maxTokens: 2000
        tokensPerFill: 2000
        fillInterval: 1m
        type: requests
    retry:
      attempts: 3
      backoff: 500ms
      codes: [429, 500, 503]
    requestMirror:
      backend:
        host: mcp-mirror:5678
      percentage: 0.1
  targets:
    - name: tickets
      mcp:
        host: http://mcp-tickets:8081/mcp
    - name: catalog
      mcp:
        host: http://mcp-catalog:8082/mcp
    - name: customers
      mcp:
        host: http://mcp-customers:8083/mcp
    - name: everything
      mcp:
        host: http://host.docker.internal:19101/mcp
    - name: time
      mcp:
        host: http://mcp-time:8084/mcp
    - name: openapi
      openapi:
        schema:
          file: /openapi/petstore.yaml
        host: petstore:8080
gateways:
  a2a:
    port: 3001
  llm-browser:
    port: 4001
routes:
  - name: llm-browser-oidc
    gateways:
      - llm-browser
    matches:
      - path:
          pathPrefix: /v1
      - path:
          exact: /oauth/callback
    policies:
      oidc:
        issuer: http://host.docker.internal:8080/realms/agentgateway
        clientId: agentgateway-browser
        clientSecret: agentgateway-browser-secret
        redirectURI: http://localhost:4001/oauth/callback
        authorizationEndpoint: http://localhost:8080/realms/agentgateway/protocol/openid-connect/auth
        tokenEndpoint: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/token
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
        scopes:
          - profile
          - email
      cors:
        allowOrigins:
          - http://localhost:15000
        allowMethods:
          - GET
          - POST
          - OPTIONS
        allowHeaders:
          - authorization
          - content-type
          - cache-control
        allowCredentials: true
        maxAge: 10m
    backends:
      - ai:
          name: deepseek-browser
          provider:
            openAI:
              model: deepseek-chat
          hostOverride: api.deepseek.com:443
          policies:
            backendAuth:
              key: $DEEPSEEK_API_KEY
            ai:
              routes:
                /v1/chat/completions: completions
                /v1/responses: responses
              prompts:
                prepend:
                  - role: system
                    content: You are the support platform assistant. Prefer concise, actionable answers.
  - name: a2a-support-agent
    gateways:
      - a2a
    policies:
      a2a: {}
      cors:
        allowOrigins:
          - "*"
        allowHeaders:
          - content-type
          - cache-control
          - authorization
      jwtAuth:
        mode: strict
        issuer: http://host.docker.internal:8080/realms/agentgateway
        audiences:
          - agentgateway
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
      localRateLimit:
        - maxTokens: 60
          tokensPerFill: 60
          fillInterval: 1m
          type: requests
    backends:
      - host: support-agent:9999
