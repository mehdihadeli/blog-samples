# Optional LLM policy fragment.
# Merge this guardrail into llm.models[] only when OPENAI_API_KEY is set.
# It calls OpenAI's moderation endpoint before the provider request.
llm:
  models:
    - name: deepseek-v4-flash
      guardrails:
        request:
          - openAIModeration:
              model: omni-moderation-latest
              policies:
                backendAuth:
                  key: "$OPENAI_API_KEY"
                rejection:
                  body: "Content blocked by moderation policy"
    - name: deepseek-v4-pro
      guardrails:
        request:
          - openAIModeration:
              model: omni-moderation-latest
              policies:
                backendAuth:
                  key: "$OPENAI_API_KEY"
                rejection:
                  body: "Content blocked by moderation policy"
