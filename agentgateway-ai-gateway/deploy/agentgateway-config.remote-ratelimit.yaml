# ---------------------------------------------------------------------------
# agentgateway standalone configuration - REMOTE (Envoy) rate limiting
# variant. OPTIONAL.
#
# This file is identical to agentgateway-config.yaml except that the LLM
# policy uses a per-user token budget and MCP/A2A use remote request limits.
# All counters are enforced by the Envoy-compatible ratelimit service + Redis
# that docker-compose.ratelimit.yaml adds to the stack.
#
# Start the stack with remote rate limiting:
#   ./scripts/start-mcps.sh --ratelimit
#
# Keep this file in sync with agentgateway-config.yaml when editing the
# main file.
# ---------------------------------------------------------------------------

config:
  # Expose the Admin UI on all interfaces inside Docker (default is localhost).
  adminAddr: 0.0.0.0:15000
  modelCatalog:
    - file: /costs/catalog.json

  # Send structured JSON logs so Loki can parse them.
  logging:
    format: json
    # SQLite request log. /var/log/agentgateway is a writable named volume
    # under the read-only rootfs (see docker-compose.yaml); scripts/
    # start-mcps.sh chowns it to the gateway uid 65532.
    database:
      url: sqlite:///var/log/agentgateway/request-log.db

  # Attach the virtual API key user as a metric label.
  metrics:
    fields:
      add:
        user_id: apiKey.user

  # Export traces to the OpenTelemetry Collector (OTLP gRPC).
  tracing:
    otlpEndpoint: http://otel-collector:4317
    randomSampling: true

# ---------------------------------------------------------------------------
# LLM GATEWAY (port 4000)
#
# Two DeepSeek models plus a virtual model that load-balances between them.
# Virtual API keys (sk-alice-*, sk-bob-*) identify the caller so metrics,
# rate limits and audit logs can attribute traffic to a real user.
# ---------------------------------------------------------------------------
llm:
  policies:
    # Virtual API keys. The `metadata.user` value is exposed to CEL as
    # `apiKey.user` and used by metrics, logging and rate limiting.
    apiKey:
      mode: strict
      keys:
        - key: sk-alice-abc123def456
          metadata:
            user: alice
        - key: sk-bob-xyz789uvw012
          metadata:
            user: bob

    # Prompt-injection and PII guardrails. Request rules run on buffered
    # traffic before the upstream call, response rules run on the model
    # output. `streaming: Enabled` keeps SSE streaming working.
    guardrails:
      streaming: Enabled
      request:
        - regex:
            action: reject
            rules:
              # Classic jailbreak patterns
              - pattern: (?i)(ignore|disregard) (all )?(previous|prior|above) (instructions|prompts|rules|messages)
              - pattern: (?i)(reveal|show) (your|the) (system prompt|system instructions|prompt)
              - pattern: (?i)(you are now|act as if) .*(no restrictions|unfiltered|uncensored)
      response:
        - regex:
            action: reject
            rules:
              # Builtin PII detectors
              - builtin: email
              - builtin: ssn
              - builtin: creditCard

    # Per-user LLM token budgets. The Envoy ratelimit server looks up
    # `user_id` and enforces the rules in infra/ratelimit/config.yaml.
    # `apiKey.user` comes from Keycloak-independent virtual-key metadata, so
    # Alice and Bob receive separate token counters. Token limits are checked
    # at request and response time by AgentGateway.
    remoteRateLimit:
      host: ratelimit:8081
      domain: agentgateway
      failureMode: failOpen
      type: tokens
      descriptors:
        - entries:
            - key: user_id
              value: "apiKey.user"

  models:
    - name: deepseek-chat
      visibility: public
      provider: deepseek
      params:
        apiKey: "$DEEPSEEK_API_KEY"
        model: deepseek-chat
      transformation:
        max_tokens: "min(llmRequest.max_tokens, 1024)"
    - name: deepseek-reasoner
      visibility: public
      provider: deepseek
      params:
        apiKey: "$DEEPSEEK_API_KEY"
        model: deepseek-reasoner
      transformation:
        max_tokens: "min(llmRequest.max_tokens, 1024)"
    - name: deepseek-chat-backup
      visibility: internal
      provider: deepseek
      params:
        apiKey: "$DEEPSEEK_API_KEY"
        model: deepseek-chat
      health:
        eviction:
          consecutiveFailures: 1
          duration: 60s

  # A virtual model that spreads load between the two DeepSeek models.
  # Clients request "deepseek-smart" and the gateway picks a target.
  virtualModels:
    - name: deepseek-smart
      routing:
        weighted:
          targets:
            - model: deepseek-chat
              weight: 70
            - model: deepseek-reasoner
              weight: 30
    - name: deepseek-resilient
      routing:
        failover:
          targets:
            - model: deepseek-chat
              priority: 0
            - model: deepseek-chat-backup
              priority: 1

# ---------------------------------------------------------------------------
# MCP GATEWAY (port 3000)
#
# Multiplexes six MCP targets behind one endpoint. Every tool gets the
# `<target>_<tool>` prefix (e.g. `tickets_tickets_list`). Keycloak JWTs are
# required and CEL rules authorize each tool call.
#
# tickets/catalog/customers/time run as containers in the compose stack;
# everything runs on the HOST via ToolHive (scripts/start-mcps.sh) and is
# reached through host.docker.internal (extra_hosts in compose).
# ---------------------------------------------------------------------------
mcp:
  statefulMode: stateless
  policies:
    # Needed for the MCP Tool Playground in the Admin UI.
    cors:
      allowOrigins: ["http://localhost:15000"]
      allowMethods: [POST, OPTIONS]
      allowHeaders:
        [
          authorization,
          content-type,
          accept,
          cache-control,
          mcp-protocol-version,
          mcp-session-id,
        ]
      exposeHeaders: [mcp-session-id]
      allowCredentials: true
      maxAge: 10m

    # Validate Keycloak access tokens (OAuth2/OIDC, PKCE for browser flows).
    mcpAuthentication:
      mode: strict
      issuer: http://host.docker.internal:8080/realms/agentgateway
      audiences:
        - agentgateway
      jwks:
        url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
      provider:
        keycloak: {}
      clientId: agentgateway-browser
      clientSecret: agentgateway-browser-secret
      resourceMetadata:
        resource: http://localhost:3000/mcp
        scopesSupported:
          - read:all
        bearerMethodsSupported:
          - header

    # Tool-level authorization. Rules are OR-ed. Only users holding the
    # Keycloak role `support-admin` may touch the customers tools.
    mcpAuthorization:
      rules:
        - 'mcp.tool.target == "tickets"'
        - 'mcp.tool.target == "catalog"'
        - 'mcp.tool.target == "time"'
        - 'mcp.tool.target == "everything"'
        - 'mcp.tool.target == "customers" && "support-admin" in jwt.realm_access.roles'
        - 'mcp.tool.target == "openapi"'

    retry:
      attempts: 3
      backoff: 500ms
      codes: [429, 500, 503]

    requestMirror:
      backend:
        host: mcp-mirror:5678
      percentage: 0.1

    # Per-user rate limiting for MCP traffic, keyed on the JWT subject
    # (falls back to "anonymous" for unauthenticated requests).
    remoteRateLimit:
      host: ratelimit:8081
      domain: agentgateway
      failureMode: failOpen
      type: requests
      descriptors:
        - entries:
            - key: user
              value: 'default(jwt.sub, "anonymous")'

  targets:
    - name: tickets
      mcp:
        host: http://mcp-tickets:8081/mcp
    - name: catalog
      mcp:
        host: http://mcp-catalog:8082/mcp
    - name: customers
      mcp:
        host: http://mcp-customers:8083/mcp
    # Host-side ToolHive proxies (scripts/start-mcps.sh):
    #   thv run npx://@modelcontextprotocol/server-everything@latest \
    #     --proxy-port 19101 --transport stdio --proxy-mode streamable-http
    #   thv run docker.io/mcp/time \
    #     --proxy-port 19102 --transport stdio --proxy-mode streamable-http
    - name: everything
      mcp:
        host: http://host.docker.internal:19101/mcp
    - name: time
      mcp:
        host: http://mcp-time:8084/mcp
    - name: openapi
      openapi:
        schema:
          file: /openapi/petstore.yaml
        host: petstore:8080

# ---------------------------------------------------------------------------
# A2A GATEWAY (port 3001)
#
# Proxies the Agent-to-Agent (A2A) protocol to the .NET SupportAgent and
# rewrites its agent card so clients always talk to the gateway URL.
#
# The route is protected with the same Keycloak JWT validation used by the
# MCP gateway. Browser/SPA clients obtain the access token through the
# public Keycloak client with OIDC Authorization Code + PKCE; the demo
# SupportChat console uses the password grant for simplicity.
# ---------------------------------------------------------------------------
gateways:
  a2a:
    port: 3001
  llm-browser:
    port: 4001

routes:
  - name: llm-browser-oidc
    gateways: [llm-browser]
    matches:
      - path:
          pathPrefix: /v1
      - path:
          exact: /oauth/callback
    policies:
      oidc:
        issuer: http://host.docker.internal:8080/realms/agentgateway
        clientId: agentgateway-browser
        clientSecret: agentgateway-browser-secret
        redirectURI: http://localhost:4001/oauth/callback
        authorizationEndpoint: http://localhost:8080/realms/agentgateway/protocol/openid-connect/auth
        tokenEndpoint: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/token
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
        scopes: [profile, email]
      cors:
        allowOrigins: ["http://localhost:15000"]
        allowMethods: [GET, POST, OPTIONS]
        allowHeaders: [authorization, content-type, cache-control]
        allowCredentials: true
        maxAge: 10m
    backends:
      - ai:
          name: deepseek-browser
          provider:
            openAI:
              model: deepseek-chat
          hostOverride: api.deepseek.com:443
          policies:
            backendAuth:
              key: "$DEEPSEEK_API_KEY"
            ai:
              routes:
                /v1/chat/completions: completions
                /v1/responses: responses
              prompts:
                prepend:
                  - role: system
                    content: You are the support platform assistant. Prefer concise, actionable answers.

  - name: a2a-support-agent
    gateways: [a2a]
    policies:
      a2a: {}
      cors:
        allowOrigins: ["*"]
        allowHeaders: [content-type, cache-control, authorization]

      # Validate Keycloak access tokens (OAuth2/OIDC, PKCE for browser flows).
      jwtAuth:
        mode: strict
        issuer: http://host.docker.internal:8080/realms/agentgateway
        audiences:
          - agentgateway
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs

      # Per-user rate limiting for A2A traffic, keyed on the JWT subject.
      remoteRateLimit:
        host: ratelimit:8081
        domain: agentgateway
        failureMode: failOpen
        type: requests
        descriptors:
          - entries:
              - key: user
                value: 'default(jwt.sub, "anonymous")'

    backends:
      - host: support-agent:9999

# ---------------------------------------------------------------------------
# Admin UI security (optional).
#
# By default the Admin UI binds to 0.0.0.0:15000 without authentication.
# To protect it, attach it to a gateway and add an OIDC policy plus the
# OIDC_COOKIE_SECRET environment variable:
#
#   ui:
#     policies:
#       oidc:
#         issuer: http://localhost:8080/realms/agentgateway
#         clientId: agentgateway-browser
#         clientSecret: <client-secret>
#         redirectURI: http://localhost:3000/oauth/callback
#         scopes: [profile, email]
#       authorization:
#         rules:
#           - allow: jwt.email.endsWith("@example.com")
# ---------------------------------------------------------------------------
