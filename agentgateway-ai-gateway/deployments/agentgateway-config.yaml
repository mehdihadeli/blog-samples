# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  # Listener and request flow:
  #
  #   YARP public path -> Agent Gateway listener -> route -> policies -> backend
  #
  # The listener is a protocol/authentication boundary, not a model boundary.
  # Models are selected later by the route backend. Therefore several
  # listeners can expose the same AI capabilities (chat/responses/models) with
  # different client authentication requirements.
  #
  # Default Agent Gateway listeners used by this sample:
  #   3000  MCP protocol: tools/resources, protected by mcpAuthentication.
  #   4000  OpenAI-compatible LLM API, protected by llm.policies.apiKey.
  # Named listeners below:
  #   3001  A2A protocol for agent-to-agent messages.
  #   4001  Browser LLM API, OIDC Authorization Code + PKCE session cookie.
  #   4002  VS Code LLM API, JWT bearer token validation.
  # Management listeners:
  #   15000 Admin UI/API; 15020 Prometheus metrics.
  adminAddr: 0.0.0.0:15000
  modelCatalog:
    - file: /costs/catalog.json
  logging:
    format: json
    database:
      url: sqlite:///var/log/agentgateway/request-log.db
  metrics:
    fields:
      add:
        user_id: apiKey.user
  tracing:
    otlpEndpoint: http://otel-collector:4317
    randomSampling: true
llm:
  # https://agentgateway.dev/docs/standalone/latest/configuration/security/apikey-authn/
  # Default LLM component. With no gateway attachment, Agent Gateway
  # automatically creates its built-in LLM listener and route on port 4000.
  # YARP exposes that internal route publicly as /v1. The policies, models,
  # guardrails, and limits below are applied by this default LLM route.
  policies:
    apiKey:
      mode: strict
      keys:
        - key: sk-alice-abc123def456
          metadata:
            user: alice
            name: alice
        - key: sk-bob-xyz789uvw012
          metadata:
            user: bob
            name: bob

    # https://agentgateway.dev/docs/standalone/latest/configuration/security/jwt-authn/
    # VS Code alternative: replace the apiKey block above with this policy.
    # The extension owns Keycloak Authorization Code + PKCE, stores tokens in
    # VS Code SecretStorage, and sends the access JWT as a bearer token.
    # jwtAuth validates that already-issued token. mcpAuthentication is only
    # for MCP OAuth discovery and must not be copied into llm.policies.
    # jwtAuth:
    #   mode: strict
    #   issuer: http://keycloak:8080/realms/agentgateway
    #   audiences:
    #     - agentgateway
    #   jwks:
    #     url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
    guardrails:
      streaming: Enabled
      request:
        - regex:
            action: reject
            rules:
              - pattern: (?i)(ignore|disregard) (all )?(previous|prior|above) (instructions|prompts|rules|messages)
              - pattern: (?i)(reveal|show) (your|the) (system prompt|system instructions|prompt)
              - pattern: (?i)(you are now|act as if) .*(no restrictions|unfiltered|uncensored)
      response:
        - regex:
            action: reject
            rules:
              - builtin: email
              - builtin: ssn
              - builtin: creditCard
    localRateLimit:
      - maxTokens: 60
        tokensPerFill: 1
        fillInterval: 1s
        type: requests
      - maxTokens: 50000
        tokensPerFill: 50000
        fillInterval: 1h
        type: tokens
  models:
    # Provider-backed model entries. A route backend chooses which model to use.
    # Model names are logical IDs, not Docker ports.
    - name: deepseek-v4-flash
      visibility: public
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-v4-flash
      transformation:
        max_tokens: min(llmRequest.max_tokens, 1024)
    - name: deepseek-v4-pro
      visibility: public
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-v4-pro
      transformation:
        max_tokens: min(llmRequest.max_tokens, 1024)
    - name: deepseek-v4-flash-vision-exp
      visibility: public
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-v4-flash-vision-exp
    - name: deepseek-v4-flash-backup
      visibility: internal
      provider: deepseek
      params:
        apiKey: $DEEPSEEK_API_KEY
        model: deepseek-v4-flash
      health:
        eviction:
          consecutiveFailures: 1
          duration: 60s
  virtualModels:
    # Logical routing IDs. A request naming deepseek-smart or
    # deepseek-resilient is routed to their target models by policy.
    - name: deepseek-smart
      routing:
        weighted:
          targets:
            - model: deepseek-v4-flash
              weight: 70
            - model: deepseek-v4-pro
              weight: 30
    - name: deepseek-resilient
      routing:
        failover:
          targets:
            - model: deepseek-v4-flash
              priority: 0
            - model: deepseek-v4-flash-backup
              priority: 1
mcp:
  # Default MCP component. Agent Gateway automatically creates its built-in
  # MCP listener and route on port 3000 when no gateway attachment is given.
  # YARP exposes that internal route publicly as /mcp. The policies and MCP
  # targets below are applied by this default MCP route.
  # Active auth: Keycloak/OIDC with PKCE-compatible OAuth discovery.
  # API-key authentication remains documented below as an alternative.
  statefulMode: stateless
  policies:
    cors:
      allowOrigins:
        - http://localhost:5000
      allowMethods:
        - POST
        - OPTIONS
        - GET
      allowHeaders:
        - authorization
        - content-type
        - accept
        - cache-control
        - mcp-protocol-version
        - mcp-session-id
        - "*"
      exposeHeaders:
        - mcp-session-id
      allowCredentials: true
      maxAge: 10m
    # https://agentgateway.dev/docs/standalone/latest/configuration/security/mcp-authn/
    mcpAuthentication:
      mode: strict
      issuer: http://keycloak:8080/realms/agentgateway
      audiences:
        - agentgateway
      jwks:
        url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
      provider:
        keycloak: {}
      clientId: agentgateway-browser
      clientSecret: agentgateway-browser-secret
      resourceMetadata:
        resource: http://localhost:5000/mcp
        scopesSupported:
          - read:all
        bearerMethodsSupported:
          - header

    # https://agentgateway.dev/docs/standalone/latest/configuration/security/apikey-authn/
    # Alternative approach for non-interactive clients:
    # replace mcpAuthentication above with this policy. Do not enable both.
    # apiKey:
    #   mode: strict
    #   keys:
    #     - key: replace-with-mcp-client-api-key
    #       metadata:
    #         user: mcp-client
    #         role: support
    mcpAuthorization:
      rules:
        - mcp.tool.target == "tickets"
        - mcp.tool.target == "catalog"
        - mcp.tool.target == "time"
        - mcp.tool.target == "everything"
        - mcp.tool.target == "sequentialthinking"
        - mcp.tool.target == "customers" && "support-admin" in jwt.realm_access.roles
        - mcp.tool.target == "openapi"
    localRateLimit:
      # Keep local demo traffic bounded without overwhelming request-log
      # storage during integration tests.
      - maxTokens: 60
        tokensPerFill: 1
        fillInterval: 1s
        type: requests
    retry:
      attempts: 3
      backoff: 500ms
      codes:
        - 429
        - 500
        - 503
    requestMirror:
      backend:
        host: mcp-mirror:5678
      percentage: 0.1
  targets:
    - name: tickets
      mcp:
        host: http://mcp-tickets:8081/mcp
    - name: catalog
      mcp:
        host: http://mcp-catalog:8082/mcp
    - name: customers
      mcp:
        host: http://mcp-customers:8083/mcp
    - name: everything
      mcp:
        host: http://host.docker.internal:19101/mcp
    - name: sequentialthinking
      mcp:
        host: http://host.docker.internal:19103/mcp
    - name: time
      mcp:
        host: http://mcp-time:8084/mcp
    - name: openapi
      openapi:
        schema:
          file: /openapi/petstore.yaml
        host: petstore:8080
gateways:
  # Each gateway is an internal listener. Routes attach to a gateway, then
  # apply authentication/policy and forward to a backend. YARP maps its public
  # path to these listeners; it does not perform Agent Gateway authentication.
  #
  # Built-in listeners used by MCP and LLM endpoints:
  #   3000 -> MCP endpoint, protected by mcpAuthentication.
  #   4000 -> LLM endpoint, protected by llm.policies.apiKey.
  # YARP maps /mcp to 3000 and /v1 to 4000. These mappings are generated by
  # Agent Gateway defaults and are not entries in routes:.
  #
  # VS Code MCP with PKCE uses the default MCP listener on 3000:
  #   VS Code MCP client -> YARP /mcp -> Agent Gateway 3000
  # The mcpAuthentication policy validates the Keycloak token, and
  # mcpAuthorization decides which tools the user may call. This is separate
  # from the VS Code LLM listener on 4002, which validates JWTs for AI requests:
  #   VS Code LLM client -> YARP /vscode/v1 -> Agent Gateway 4002

  # A2A listener: receives agent-to-agent message requests for SupportAgent.
  a2a:
    port: 3001
  # Browser LLM listener: OIDC login and PKCE session for the web playground.
  llm-browser:
    port: 4001
  # VS Code LLM listener: JWT bearer tokens from the custom VS Code provider.
  llm-vscode:
    port: 4002
routes:
  # Route relationship:
  #   gateway -> matches -> policies -> backends -> model/provider
  #
  # The explicit routes below are needed when one component needs its own
  # path, authentication policy, or backend. The generated MCP and API-key
  # LLM routes are configured by mcp.gateways and llm.gateways instead.
  #
  # AI backends below expose OpenAI-compatible operations such as
  # /v1/chat/completions and /v1/responses. The route's client-facing
  # listener/authentication is independent from the provider model selected by
  # the backend. For example, browser and VS Code routes use separate ports
  # and auth policies but can expose the same DeepSeek model.
  # Browser clients authenticate interactively with Keycloak through OIDC.
  - name: llm-browser-oidc
    gateways:
      - llm-browser
    matches:
      # /v1 is the model API; the callback must also match or it returns 404.
      - path:
          pathPrefix: /v1
      - path:
          exact: /oauth/callback
    policies:
      # AgentGateway runs Authorization Code + PKCE and stores a session cookie.
      oidc:
        issuer: http://keycloak:8080/realms/agentgateway
        clientId: agentgateway-browser
        clientSecret: agentgateway-browser-secret
        redirectURI: http://localhost:5000/browser/oauth/callback
        authorizationEndpoint: http://localhost:5000/auth/realms/agentgateway/protocol/openid-connect/auth
        tokenEndpoint: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/token
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
        scopes:
          - profile
          - email
      cors:
        # Only the local browser tool is allowed to call this route.
        allowOrigins:
          - http://localhost:5000
        allowMethods:
          - GET
          - POST
          - OPTIONS
        allowHeaders:
          - authorization
          - content-type
          - cache-control
        allowCredentials: true
        maxAge: 10m
    backends:
      - ai:
          # Normalize OpenAI-compatible requests before forwarding to DeepSeek.
          name: deepseek-browser
          provider:
            openAI:
              model: deepseek-v4-flash
          hostOverride: $DEEPSEEK_ENDPOINT
          policies:
            # Provider credential stays on the gateway-to-provider hop.
            backendAuth:
              key: $DEEPSEEK_API_KEY
            ai:
              # Support both common OpenAI-compatible request shapes.
              routes:
                /v1/chat/completions: completions
                /v1/responses: responses
              prompts:
                prepend:
                  - role: system
                    content: You are the support platform assistant. Prefer concise, actionable answers.

  # The VS Code extension completes PKCE and sends its access JWT here.
  - name: llm-vscode-jwt
    gateways:
      - llm-vscode
    matches:
      - path:
          pathPrefix: /v1
    policies:
      # Validate issuer, audience, signature, and expiry on the bearer token.
      jwtAuth:
        mode: strict
        issuer: http://keycloak:8080/realms/agentgateway
        audiences:
          - agentgateway
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
      cors:
        # Restrict calls to the registered VS Code extension origin.
        allowOrigins:
          - vscode://agentgateway.vscode-provider
        allowMethods:
          - GET
          - POST
          - OPTIONS
        allowHeaders:
          - authorization
          - content-type
          - cache-control
        maxAge: 10m
    backends:
      - ai:
          # Same provider boundary as browser traffic, different client auth.
          name: deepseek-vscode
          provider:
            openAI:
              model: deepseek-v4-flash
          hostOverride: $DEEPSEEK_ENDPOINT
          policies:
            backendAuth:
              key: $DEEPSEEK_API_KEY
            ai:
              routes:
                /v1/chat/completions: completions
                /v1/responses: responses
              prompts:
                prepend:
                  - role: system
                    content: You are the support platform assistant. Prefer concise, actionable answers.

  - name: a2a-support-agent
    gateways:
      - a2a
    policies:
      a2a: {}
      cors:
        allowOrigins:
          - "*"
        allowHeaders:
          - content-type
          - cache-control
          - authorization
      jwtAuth:
        mode: strict
        issuer: http://keycloak:8080/realms/agentgateway
        audiences:
          - agentgateway
        jwks:
          url: http://keycloak:8080/realms/agentgateway/protocol/openid-connect/certs
      localRateLimit:
        - maxTokens: 60
          tokensPerFill: 60
          fillInterval: 1m
          type: requests
    backends:
      - host: support-agent:9999
