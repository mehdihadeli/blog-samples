#   modelSpec:
#     - name: "qwen3-06b"
#       env:
#         - name: VLLM_LOGGING_LEVEL
#           value: "DEBUG"
#       lmcacheConfig:
#         enableController: true
#         logLevel: "DEBUG"
#
# Shared cache:
