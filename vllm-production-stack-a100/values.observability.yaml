servingEngineSpec:
  modelSpec:
  - name: "qwen3-06b"
    repository: "lmcache/vllm-openai"
    tag: "2025-05-27-v1"
    modelURL: "Qwen/Qwen3-0.6B"
    replicaCount: 2
    requestCPU: 6
    requestMemory: "24Gi"
    limitCPU: "8"
    limitMemory: "28Gi"
    requestGPU: 1
    requestGPUType: "nvidia.com/mig-2g.20gb"
    pvcStorage: "40Gi"
    shmSize: "8Gi"
    vllmConfig:
      enablePrefixCaching: true
      maxModelLen: 8192
      maxNumSeqs: 64
      gpuMemoryUtilization: 0.7
      tensorParallelSize: 1
      dtype: "bfloat16"
      extraArgs:
      - "--disable-log-requests"
    lmcacheConfig:
      enabled: true
      cpuOffloadingBufferSize: "20"
      logLevel: "INFO"
    env:
    - name: OTEL_SERVICE_NAME
      value: "vllm-engine"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector:4317"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name=vllm-engine,deployment.environment=production"

routerSpec:
  otel:
    endpoint: "otel-collector:4317"
    serviceName: "vllm-router"
    secure: false

observabilitySpec:
  jaeger:
    enabled: true
  otelCollector:
    enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
